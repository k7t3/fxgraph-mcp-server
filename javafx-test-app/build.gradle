plugins {
    id 'application'
    alias(libs.plugins.javafx)
}

javafx {
    version = '22.0.1'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

application {
    mainClass = 'io.github.k7t3.simplefx.Main'
    applicationName = 'Simple JavaFX App'
}

dependencies {
    implementation libs.atlantafx.base
    implementation libs.flowless

    testImplementation project(':fxgraph-agent')
    testImplementation libs.assertj.core
    testImplementation 'org.testfx:testfx-junit5:4.0.18'
    testImplementation 'org.testfx:openjfx-monocle:21.0.2'
}

test {
    systemProperty 'testfx.robot', 'glass'
    systemProperty 'testfx.headless', 'true'
    systemProperty 'prism.order', 'sw'
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'glass.platform', 'Monocle'
    systemProperty 'monocle.platform', 'Headless'
    systemProperty 'headless.geometry', '1600x1200-32'
}

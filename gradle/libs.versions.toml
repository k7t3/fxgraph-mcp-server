[versions]
assertj                   = "3.27.7"
jackson                   = "2.18.3"
jcodec                    = "0.2.5"
junit                     = "5.10.0"
mockito                   = "5.23.0"
javafx                    = "21"
atlantafx                 = "2.0.1"
spring-boot               = "4.0.2"
spring-ai-mcp             = "1.1.2"
spring-dependency-management = "1.1.4"
shadow                    = "9.3.1"
openjfx-plugin            = "0.1.0"

[libraries]
assertj-core              = { module = "org.assertj:assertj-core",                              version.ref = "assertj" }
jackson-databind          = { module = "com.fasterxml.jackson.core:jackson-databind",            version.ref = "jackson" }
jcodec-core               = { module = "org.jcodec:jcodec",                                    version.ref = "jcodec" }
jcodec-javase             = { module = "org.jcodec:jcodec-javase",                             version.ref = "jcodec" }
junit-bom                 = { module = "org.junit:junit-bom",                                    version.ref = "junit" }
junit-jupiter             = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher   = { module = "org.junit.platform:junit-platform-launcher" }
mockito-junit-jupiter     = { module = "org.mockito:mockito-junit-jupiter",                      version.ref = "mockito" }
atlantafx-base            = { module = "io.github.mkpaz:atlantafx-base",                         version.ref = "atlantafx" }
spring-ai-mcp-server      = { module = "org.springframework.ai:spring-ai-starter-mcp-server",   version.ref = "spring-ai-mcp" }

[plugins]
shadow                       = { id = "com.gradleup.shadow",               version.ref = "shadow" }
spring-boot                  = { id = "org.springframework.boot",          version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management",  version.ref = "spring-dependency-management" }
javafx                       = { id = "org.openjfx.javafxplugin",         version.ref = "openjfx-plugin" }

plugins {
    id 'application'
    alias(libs.plugins.shadow)
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

application {
    mainClass = 'io.github.k7t3.fxgraph.mcp.server.McpServerApplication'
}

dependencies {
    // Spring AI MCP Server Starter
    implementation libs.spring.ai.mcp.server

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'

    // Spring Web (provides StandardServletEnvironment used by Spring AI MCP auto-config)
    implementation 'org.springframework:spring-web'

    // Core subproject - provides JavaFxAgent, protocol classes, and model classes.
    // The agent JAR itself is still loaded separately into target JVMs via Attach API.
    implementation project(':fxgraph-core')

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    dependsOn shadowJar
    testLogging {
        showStandardStreams = true
    }
}

shadowJar {
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
    manifest {
        attributes(
            'Main-Class': 'io.github.k7t3.fxgraph.mcp.server.McpServerApplication',
        )
    }
}

// Copy the agent shadow JAR next to the MCP server shadow JAR after build
tasks.register('copyAgentJar', Copy) {
    dependsOn ':fxgraph-agent:shadowJar'
    from project(':fxgraph-agent').layout.buildDirectory.dir('libs')
    include 'fxgraph-agent.jar'
    into layout.buildDirectory.dir('libs')
}

shadowJar.finalizedBy copyAgentJar

// Ensure tasks that use the libs directory depend on copyAgentJar
tasks.named('distZip') { dependsOn copyAgentJar }
tasks.named('distTar') { dependsOn copyAgentJar }
tasks.named('startScripts') { dependsOn copyAgentJar }
tasks.named('bootDistZip') { dependsOn copyAgentJar }
tasks.named('bootDistTar') { dependsOn copyAgentJar }
tasks.named('bootStartScripts') { dependsOn copyAgentJar }
tasks.named('shadowDistZip') { dependsOn copyAgentJar }
tasks.named('shadowDistTar') { dependsOn copyAgentJar }
tasks.named('startShadowScripts') { dependsOn copyAgentJar }

plugins {
    id 'application'
    alias(libs.plugins.shadow)
}

application {
    mainClass = 'io.github.k7t3.fxgraph.mcp.cli.FxgraphApplication'
}

dependencies {
    implementation project(':core')
    implementation libs.jackson.databind

    testImplementation libs.mockito.junit.jupiter
}

test {
    testLogging {
        showStandardStreams = true
    }
}

shadowJar {
    archiveBaseName.set('fxgraph-cli')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
    manifest {
        attributes('Main-Class': 'io.github.k7t3.fxgraph.mcp.cli.FxgraphApplication')
    }
}

// Copy the agent shadow JAR next to the CLI shadow JAR after build
tasks.register('copyAgentJar', Copy) {
    dependsOn ':agent:shadowJar'
    from project(':agent').layout.buildDirectory.dir('libs')
    include 'fxgraph-agent.jar'
    into layout.buildDirectory.dir('libs')
}

shadowJar.finalizedBy copyAgentJar

// Ensure tasks that use the libs directory depend on copyAgentJar
tasks.named('distZip')            { dependsOn copyAgentJar }
tasks.named('distTar')            { dependsOn copyAgentJar }
tasks.named('startScripts')       { dependsOn copyAgentJar }
tasks.named('shadowDistZip')      { dependsOn copyAgentJar }
tasks.named('shadowDistTar')      { dependsOn copyAgentJar }
tasks.named('startShadowScripts') { dependsOn copyAgentJar }

plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'io.github.k7t3'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'io.github.k7t3.fxgraph.mcp.cli.FxgraphApplication'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

shadowJar {
    archiveBaseName.set('fxgraph-cli')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
    manifest {
        attributes('Main-Class': 'io.github.k7t3.fxgraph.mcp.cli.FxgraphApplication')
    }
}

// Copy the agent shadow JAR next to the CLI shadow JAR after build
tasks.register('copyAgentJar', Copy) {
    dependsOn ':agent:shadowJar'
    from project(':agent').layout.buildDirectory.dir('libs')
    include 'fxgraph-agent.jar'
    into layout.buildDirectory.dir('libs')
}

shadowJar.finalizedBy copyAgentJar
